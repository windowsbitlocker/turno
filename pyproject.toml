[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "debate-timer"
version = "0.1.0"
description = "Offline two-window debate timer with operator-controlled rebuttal time"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Education",
  "Environment :: X11 Applications :: Tk",
]

[project.optional-dependencies]
logos = ["Pillow>=10"]

[project.gui-scripts]
debate-timer = "debate_timer.__main__:main"

[tool.setuptools.packages.find]
include = ["debate_timer", "debate_timer.*"]
